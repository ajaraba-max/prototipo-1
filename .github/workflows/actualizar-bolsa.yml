name: Actualizar bolsa

# Consulta el precio del café C en la Bolsa de Nueva York y lo guarda en
# bolsa.json, que el prototipo lee al abrir la página y cada 5 minutos.

on:
  schedule:
    # Cada 15 minutos, de lunes a viernes, de 8:00 a 19:45 UTC
    # (3:00 a. m. a 2:45 p. m. hora de Colombia). El café C se negocia de
    # 4:15 a. m. a 1:30 p. m. hora de Nueva York. GitHub puede retrasar o
    # saltarse algunas corridas cuando tiene mucha carga.
    - cron: "*/15 8-19 * * 1-5"
  # Permite correrlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-bolsa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Consultar el precio del café C
        run: python3 scripts/actualizar_bolsa.py

      - name: Guardar bolsa.json si cambió
        run: |
          if git diff --quiet -- bolsa.json; then
            echo "bolsa.json no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bolsa.json
          git commit -m "Actualizar precio de la bolsa"
          git pull --rebase
          git push
